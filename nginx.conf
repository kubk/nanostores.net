worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
    text/markdown md;
  }
  default_type application/octet-stream;
  charset_types text/plain text/markdown text/css application/javascript application/json application/manifest+json image/svg+xml;
  sendfile on;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  map $http_accept $page_index {
    default index.html;
    "~*(^|,)\s*text/markdown\s*(;\s*q=1(\.0+)?\s*)?(,|$)" index.md;
  }

  map $uri $page_link {
    default "";
    "~^(?<dir>.*/)index\.html$" "<${dir}index.md>; rel=\"alternate\"; type=\"text/markdown\"";
    "~^(?<dir>.*/)index\.md$" "<$dir>; rel=\"canonical\"";
  }
  map $uri $page_vary {
    default "";
    "~/index\.(html|md)$" Accept;
  }

  server {
    listen 8000;
    root /var/www;
    index $page_index;
    charset UTF-8;
    # Keep directory redirects on the public HTTPS origin behind the proxy.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    # Script and style rules are in each page's meta tag, because the hashes
    # belong to the page. A script-src here would be applied on top of them,
    # and also to Pagefind's worker, which would then need 'wasm-unsafe-eval'.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Link $page_link always;
    add_header Vary $page_vary always;
    error_page 404 /404.html;

    location / {
      try_files $uri $uri/ =404;
    }

    # Astro fingerprints these files; pages and public assets can change in place.
    location /_astro/ {
      expires 1y;
      try_files $uri =404;
    }

    location = /404.html {
      internal;
    }
  }
}
